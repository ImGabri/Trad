# XAUUSD scalper configuration. Secrets (MT5 password, Telegram token) live in .env, never here.

broker:
  server: ""                 # e.g. "PUPrime-Demo" — filled from MT5_SERVER in .env if blank
  terminal_path: ""          # only if several MT5 terminals are installed, e.g. "C:/Program Files/PU Prime MT5 Terminal/terminal64.exe"
  server_utc_offset_hours: auto   # "auto" = detect from live tick time; or an integer (PUPrime is usually +2/+3)
  account_type: STANDARD     # STANDARD (no commission, ~$0.32 spread, symbols end in .s) | ECN ($1/side/lot) | PRIME ($3.5/side/lot)
  leverage: 500              # used for margin estimates in backtest; live uses order_calc_margin

symbols:
  primary: XAUUSD            # standard 24/5 gold, NOT XAUUSD247

# Other markets fed to the AI as 1- and 5-minute % changes. `mt5`: PU Prime symbol candidates (the account
# suffix such as ".s" is added automatically); `hf`: public 1-minute history for training on older years.
# A market is only used when it is available both live and in training; markets PU Prime does not offer are skipped.
context:
  dxy:    {mt5: [USDX, DXY, USDIndex, USIndex, DOLLAR_INDX], hf: ""}
  spx:    {mt5: [SP500, US500, SPX500, SP500ft], hf: bunqi/OANDA_SPX500USD_US-SPX-500}
  nas100: {mt5: [NAS100, USTEC, US100, NASCOMP], hf: bunqi/OANDA_NAS100USD_US-Nas-100}
  silver: {mt5: [XAGUSD], hf: bunqi/OANDA_XAGUSD_Silver}
  eurusd: {mt5: [EURUSD], hf: bunqi/OANDA_EURUSD_EURUSD}
  usdjpy: {mt5: [USDJPY], hf: bunqi/OANDA_USDJPY_USDJPY}
  wti:    {mt5: [USOUSD, USOIL, XTIUSD, CL-OIL], hf: bunqi/OANDA_WTICOUSD_West-Texas-Oil}
  audusd: {mt5: [AUDUSD], hf: bunqi/OANDA_AUDUSD_AUDUSD}
  usdcnh: {mt5: [USDCNH], hf: bunqi/OANDA_USDCNH_USDCNH}
  # v2.7 — more markets that move with (or against) gold. Used once the AI retrains (weekend or "Retrain AI now").
  gbpusd:  {mt5: [GBPUSD], hf: bunqi/OANDA_GBPUSD_GBPUSD}
  usdchf:  {mt5: [USDCHF], hf: bunqi/OANDA_USDCHF_USDCHF}            # franc = the other safe haven
  usdcad:  {mt5: [USDCAD], hf: bunqi/OANDA_USDCAD_USDCAD}
  nzdusd:  {mt5: [NZDUSD], hf: bunqi/OANDA_NZDUSD_NZDUSD}
  eurjpy:  {mt5: [EURJPY], hf: bunqi/OANDA_EURJPY_EURJPY}
  audjpy:  {mt5: [AUDJPY], hf: bunqi/OANDA_AUDJPY_AUDJPY}            # risk-on / risk-off gauge
  gbpjpy:  {mt5: [GBPJPY], hf: bunqi/OANDA_GBPJPY_GBPJPY}
  eurchf:  {mt5: [EURCHF], hf: bunqi/OANDA_EURCHF_EURCHF}
  xaueur:  {mt5: [XAUEUR], hf: bunqi/OANDA_XAUEUR_GoldEUR}           # gold in other currencies
  xaujpy:  {mt5: [XAUJPY], hf: bunqi/OANDA_XAUJPY_GoldJPY}
  xauaud:  {mt5: [XAUAUD], hf: bunqi/OANDA_XAUAUD_GoldAUD}
  platinum:  {mt5: [XPTUSD, PLATINUM], hf: bunqi/OANDA_XPTUSD_Platinum}
  palladium: {mt5: [XPDUSD, PALLADIUM], hf: bunqi/OANDA_XPDUSD_Palladium}
  copper:  {mt5: [COPPER, XCUUSD, HG-C], hf: bunqi/OANDA_XCUUSD_Copper}
  brent:   {mt5: [UKOUSD, UKOIL, XBRUSD, BRENT], hf: bunqi/OANDA_BCOUSD_Brent-Crude-Oil}
  natgas:  {mt5: [NG-C, NGAS, XNGUSD, NATGAS], hf: bunqi/OANDA_NATGASUSD_Natural-Gas}
  us30:    {mt5: [US30, DJ30, DJI30, WS30], hf: bunqi/OANDA_US30USD_US-Wall-St-30}
  us2000:  {mt5: [US2000, RUSS2000, US2K], hf: bunqi/OANDA_US2000USD_US-Russ-2000}
  dax:     {mt5: [GER40, DE40, GER30, DAX40], hf: bunqi/OANDA_DE30EUR_Germany-30}
  eu50:    {mt5: [EU50, EUSTX50, STOXX50], hf: bunqi/OANDA_EU50EUR_Europe-50}
  uk100:   {mt5: [UK100, FTSE100], hf: bunqi/OANDA_UK100GBP_UK-100}
  jp225:   {mt5: [JP225, JPN225, NIKKEI], hf: bunqi/OANDA_JP225USD_Japan-225}
  hk50:    {mt5: [HK50, HSI, HK33], hf: bunqi/OANDA_HK33HKD_Hong-Kong-33}
  china50: {mt5: [CHINA50, CN50, CHINAA50], hf: bunqi/OANDA_CN50USD_China-A50}
  btc:     {mt5: [BTCUSD], hf: bunqi/OANDA_BTCUSD_Bitcoin}
  eth:     {mt5: [ETHUSD], hf: bunqi/OANDA_ETHUSD_Ether}
  us10y:   {mt5: [UST10Y, US10Y, TNOTE], hf: bunqi/OANDA_USB10YUSD_US-10Y-T-Note}   # real yields drive gold
  us02y:   {mt5: [UST02Y, US02Y], hf: bunqi/OANDA_USB02YUSD_US-2Y-T-Note}
  bund:    {mt5: [BUND, DE10Y, EUBUND], hf: bunqi/OANDA_DE10YBEUR_Bund}
  vix:     {mt5: [VIX, VIXX, VOLX], hf: ""}                             # live only (no training history)

instrument:                  # XAUUSD contract spec; live values are re-read from symbol_info
  contract_size: 100         # oz per lot -> $1 move = $100/lot
  pip_size: 0.10             # spec: 5–30 pips = $0.5–$3.0
  min_lot: 0.01
  lot_step: 0.01
  max_lot: 5.0

sessions:                    # all times UTC
  week_open:  {day: 6, time: "22:00"}   # Sunday (Mon=0 … Sun=6)
  week_close: {day: 4, time: "22:00"}   # Friday
  no_entry_windows:
    - {day: 4, start: "21:00", end: "22:00"}   # Friday pre-close
    - {day: 6, start: "21:00", end: "22:00"}   # Sunday reopen (pre-open)
    - {day: 6, start: "22:00", end: "23:00"}   # Sunday post-reopen spread widening
  flat_by: {day: 4, time: "21:00"}            # flatten everything Friday 21:00
  london:  ["07:00", "16:00"]
  newyork: ["13:00", "21:00"]
  asia:    ["00:00", "07:00"]
  asia_min_confidence: 0.55  # Asia: a bit more AI agreement needed (Careful = 0.75)
  asia_enabled: false

strategy:   # defaults tuned for a €50 PU Prime Standard account (least-losing of 400 trials, 2019–2026)
  m15_ema_fast: 50
  m15_ema_slow: 200
  m15_slope_lookback: 3
  m15_adx_min: 15
  level_tolerance_atr: 0.4  # price within this × ATR(M5) of a key level
  fib_levels: [0.618, 0.786]
  fib_swing_bars_m5: 48      # swing range for fib levels (4h of M5)
  m1_trigger_bars: 3         # consecutive M1 candles in bias direction
  require_rising_volume: true
  vol_confirm_mult: 1.2      # vol filter: require above-median vol when above mult×median
  atr_period: 14
  tp_atr: 2.0
  sl_atr: 0.5
  trail_trigger_atr: 0.5
  trail_distance_atr: 0.75
  time_stop_minutes: 20
  mode: turbo                # turbo (default, best in testing) | scalp (rules + AI) | basket — dashboard style buttons
  ai_gate: true
  confidence_threshold: 0.5   # "Active" demo style: trade every rule setup the AI agrees with (Careful = 0.65)
  # Equity take-profit: close a trade once it is +X % of account equity in profit — unless the AI still
  # expects the move to continue (P(direction) >= hold_conf); then lock lock_frac of that gain with the SL
  # and keep riding, leaving as soon as the AI stops agreeing.
  equity_tp_pct: 3.0
  equity_tp_hold_conf: 0.5
  equity_tp_lock_frac: 0.5
  # Fast mode: when > 0, the AI alone may open a trade (no rule setup needed) at this confidence or higher,
  # never against the M15 bias. 0 = off.
  ai_only_min_conf: 0.7

  # === Continuous Trading Options ===
  skip_market_open_check: false  # When true, bot trades uninterrupted skipping market open/close checks
                           # Useful for 24/7 AI interpretation based on Austria timezone

risk:
  # Small-account mode (€50 start): 0.01 lot = 1 oz, so a ~$4 stop risks ~7 % of €50. The 0.5 % rule would
  # block every trade; when > 0 the bot may trade the minimum lot if that risks ≤ this % of equity.
  # Lots compound automatically: above ~€800 the normal risk_per_trade_pct sizing takes over.
  min_lot_max_risk_pct: 10
  risk_per_trade_pct: 0.5
  daily_loss_limit_pct: 15   # spec said 2 %, but one min-lot loss on €50 is ~7 % → allow ~2 losses/day
  max_concurrent: 3
  max_daily_trades: 40
  survival_multiplier: 1.5   # hard stop if equity <= (margin_0.01 + SL_loss_0.01) × this
  spread_filter_mult: 2.0    # no entry if spread > mult × 20-bar avg
  spread_avg_bars: 20
  max_slippage_pips: 3
  allow_averaging_down: false

news:
  provider: forexfactory     # forexfactory JSON feed or a CSV exported from MT5 calendar (see README)
  ff_url: "https://nfs.faireconomy.media/ff_calendar_thisweek.json"
  currencies: [USD]
  keywords: [Non-Farm, NFP, CPI, FOMC, Federal Funds, PPI, Retail Sales, GDP]
  pre_block_min: [15, 5]     # T-15 .. T-5: no entries, tighten SL
  pre_tighten_sl_atr: 0.5
  event_window_min: 5        # T-5 .. T+5: news scalp only
  news_scalp_min_conf: 0.75
  news_scalp_spread_mult: 1.5
  news_scalp_sl_atr: 1.5
  news_scalp_tp_atr: 2.0
  post_window_min: [5, 15]   # T+5 .. T+15: SL × 1.2
  post_sl_mult: 1.2

turbo:                       # 🚀 Turbo (default) — applied on top of everything when strategy.mode = turbo
  # Hourly 24-bar breakout, long-only, with the hourly EMA20/50 trend. Best of 768 tested variants: profitable in
  # 2019–23, 2024–25 AND Aug 2025–Nov 2026 for accounts from €100 (at 1 % risk). €50 blew up in 2 of 3 periods.
  strategy: {ai_gate: false, sl_atr: 3.0, tp_atr: 40.0, trail_trigger_atr: 99.0, trail_distance_atr: 99.0,
             time_stop_minutes: 900, equity_tp_pct: 0.0, ai_only_min_conf: 0.0}
  risk: {risk_per_trade_pct: 1.0, min_lot_max_risk_pct: 70, max_concurrent: 1, daily_loss_limit_pct: 30,
         survival_multiplier: 1.0,
         # Confidence sizing: × 1.5 risk when the AI agrees with the breakout (P > 0.5), × 0.5 when it does not.
         # Backtest (€10k, 1 % base, long): 2019–23 +59 % vs +55 % flat, 2024–25 +277 % vs +204 %, 2025–26 +129 % vs +68 %.
         conf_sizing: {enabled: true, sure_above: 0.5, sure_mult: 1.5, unsure_mult: 0.5}}
  analyst: {veto_conf: 0.0}
  sessions: {asia_enabled: true}   # breakouts in Asia hours were part of the tested edge

basket:                      # 🧺 Basket mode (dashboard) — opt-in. Least-losing of 1,296 tested variants; it still LOST
                             # ~$0.36 per basket (80 % wins) in 2020–2025 backtests. Demo experiment only.
  candles_tf: m5             # m1 | m5 — candles used for the direction
  candles: 5                 # last N candles all the same colour → direction
  follow: true               # true: trade with the candles; false: fade them
  step_atr: 0.75              # add a leg every step×ATR against the last entry
  max_entries: 2             # legs per basket (incl. the first)
  tp_atr: 1.0                # whole basket closes at average entry ± tp×ATR
  sl_atr: 6.0                # basket stop, measured from the FIRST entry
  hold_minutes: 240          # close the basket after this long
  equity_per_001: 50         # 0.01 lot per this much equity (account currency) — lots grow with the account

analyst:                     # "what will probably happen next" — see analyst.py
  enabled: true
  veto_conf: 0.55            # skip a trade when the 15-min outlook points the other way with ≥ this confidence
  news_agent: on             # free headline analyst (Google News RSS, no API key) — off to disable
  news_interval_min: 15
  news_veto_conf: 0.75       # skip a trade only when headlines strongly point the other way (not backtestable → cautious)

signals:                     # 📡 live public Telegram signal channels (dashboard → Signal channels). Read-only web preview.
  enabled: false
  channels: [Forexstar_Gold, UnitedKingsOfficial, EliteGoldTraders03, AnabelSignals, xauusd_signals, GoldPrincess, callistofx]
  poll_s: 20                 # check every channel every 20 s
  valid_h: 4                 # a zone post is tradeable for 4 h
  hold_h: 8                  # signal trades are closed after 8 h at the latest
  max_away: 5.0              # order posts: trade only while price is within $5 of the posted entry
  tp_mode: 2r                # 2r = target 2 × the risk (optimised); first = the channel's TP1
  max_open: 5                # signal trades open at once (on top of the style's own trades)
  max_daily: 60              # signal trades per UTC day (own count: never uses the style's daily trade limit)
  risk_pct: 0.5              # risk per signal trade (sized off its stop)
  min_lot_max_risk_pct: 25   # small accounts: a signal trade may use the minimum 0.01 lot if that risks ≤ 25 % (never more)
  min_graded: 100            # the signal AI judges a channel after 100 graded signals; it only drops clearly losing ones
  require_h4: false          # true = only take signals in the 4-hour trend's direction
  lanes: []                  # [max, hyper] = trade each signal in two lanes (≤ $5 / 8 h and any distance / 24 h)
  ai_rate: false             # true = the signal-rating AI judges every signal per lane (🔮 Signal AI styles)
  ai_threshold: 0.0          # take a lane only if the AI expects more than this $ per 0.01 lot after costs
  boost_mult: 1.0            # size × this when the AI expects more than boost_above
  boost_above: 0.5

learning:
  trade_memory: true         # fast styles (basket / extreme / hyper) learn while trading which situations lose and skip them
                             # (data/learning/memory.json; seeded from the 2020–26 backtest). Off for 🎯 Perfect — it hurt there.

history:
  years: 7                   # training history (broker bars + public OANDA data for older years)
  hf_gold: bunqi/OANDA_XAUUSD_Gold          # public Hugging Face datasets (monthly parquet, 1-minute)
  oanda_mid_to_bid: -0.16    # PU Prime bid ≈ OANDA mid − half the $0.32 spread (re-checked by the data audit)

model:
  type: lightgbm             # lightgbm | xgboost
  label_horizon_m5_bars: 5   # direction of close 25 min ahead
  retrain_every_days: 7
  train_window_days: 1095    # 3 years rolling
  drift_window_trades: 50
  drift_tolerance_pct: 15

backtest:
  spread_cost: 0.32          # $ per oz, used only when a bar has no spread data (PUPrime Standard ≈ 0.32, ECN ≈ 0.10)
  commission_per_side_per_lot: 1.0
  slippage_pips: 2
  initial_equity: 10000
  wf_train_frac: 0.70
  wf_window_months: 3
  holdout_months: 3

monitoring:
  log_dir: "data/logs"       # relative to the app folder (or absolute, e.g. C:/bots/logs)
  log_retention_days: 7
  reconnect_interval_s: 30
  reconnect_timeout_s: 600
